[package]
name = "revm-supra-extension"
version = "0.1.0"
license.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
alloy-sol-types = { workspace = true }
alloy-contract =  { workspace = true }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
serde = { workspace = true }
alloy = { workspace = true }
derive_more = { workspace = true, features = ["full"] }
derive-getters = { workspace = true }
thiserror = { workspace = true }
primitives = { workspace = true , features = ["rand"]}
context = { workspace = true }
alloy-serde = { workspace = true, optional = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true, features = ["serde"] }
once_cell = { workspace = true }
serde_with = { workspace = true, features = ["hex"] }
enum-kinds = "0.5.1"
# Optional dependencies activated by the `build-utils` feature.
# These are also present in [build-dependencies] for this crate's own build.rs;
# they are listed here so that other crates can use the build_utils module as a
# [build-dependencies] entry with `features = ["build-utils"]`.
foundry-config = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
foundry-compilers = { workspace = true , optional = true}

[lints]
workspace = true


[build-dependencies]
#forge = { workspace =  true }
#clap = { workspace = true }
#shlex = { workspace = true }
foundry-compilers = { workspace = true }
foundry-config = { workspace = true }
anyhow = { workspace = true }
toml = { workspace =  true }
serde = {workspace =  true }
serde_json = { workspace = true }
bincode = { workspace =  true , features = ["serde"]}
enum-kinds = { workspace = true }

[features]
serde = ["alloy-serde"]
# Exposes `revm_supra_extension::build_utils` — a set of utilities for compiling
# Solidity contracts and loading bytecodes inside `build.rs` scripts.
# Add this crate as a `[build-dependencies]` entry with `features = ["build-utils"]`
# to use them from another crate's build script.
build-utils = ["dep:foundry-config", "dep:toml", "dep:foundry-compilers"]
