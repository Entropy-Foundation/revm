[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
# Pin explicitly rather than relying on Foundry's implicit default of 200, so a future
# change to that default can't silently change compiled bytecode and therefore every
# CREATE2 genesis address derived from it.
optimizer_runs = 200
evm_version = "prague"
# Fix the solc version to avoid breaking changes in the future.  See
solc_version = "0.8.34"
# Do not attach cryptographic hash of compilation to contract's deployed bytecode.
bytecode_hash = "none"
# Prevent the creation and inclusion of this CBOR metadata block.
cbor_metadata = false

# Raise the block gas limit from Forge's default 2^30 (~1 billion) to accommodate
# MonitorCycleEndGas_BoundaryScan, which performs ~8 binary-search iterations in a
# single test call — each iteration registers up to LARGE_CAPACITY tasks at ~800 k gas
# each, totalling ~1.2 billion gas across the full search.  Individual N-point tests
# never exceed ~350 million gas, so this increase has no visible effect on them.
block_gas_limit = 30_000_000_000
# Uncomment when running against supra chain

#eth_rpc_url = "http://localhost:27000/rpc/v1/eth/wallet_integration"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Selected instead of [profile.default] for release builds (see select_foundry_profile
# in crates/supra-extension/build_utils_impl.rs). Foundry merges [profile.default] as
# the base for every other profile and layers this section's overrides on top.
[profile.production]
# Deployed code, not just gas cost, is the binding constraint: RegistryFacet is within
# EIP-170's 24,576-byte limit up to 800 runs and over it by 900 (see
# genesis_contract_deployed_bytecode_is_within_eip170_limit), so this stays well below
# supranova's optimizer_runs.
optimizer_runs = 800


