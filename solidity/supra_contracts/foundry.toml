[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
# Pin explicitly rather than relying on Foundry's implicit default of 200, so a future
# change to that default can't silently change compiled bytecode and therefore every
# CREATE2 genesis address derived from it.
optimizer_runs = 200
evm_version = "prague"
# Fix the solc version to avoid breaking changes in the future.  See
solc_version = "0.8.34"
# Do not attach cryptographic hash of compilation to contract's deployed bytecode.
bytecode_hash = "none"
# Prevent the creation and inclusion of this CBOR metadata block.
cbor_metadata = false

# Raise the block gas limit from Forge's default 2^30 (~1 billion) to accommodate
# MonitorCycleEndGas_BoundaryScan, which performs ~12 binary-search iterations over
# [1, LARGE_CAPACITY = 4000] in a single test call — each iteration registers up to
# LARGE_CAPACITY tasks at ~800 k gas each, ~23.8 billion gas per scan as measured.
# Individual N-point tests stay under ~650 million gas, so this increase has no visible
# effect on them.
block_gas_limit = 30_000_000_000
# Uncomment when running against supra chain

#eth_rpc_url = "http://localhost:27000/rpc/v1/eth/wallet_integration"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Selected instead of [profile.default] for release builds (see select_foundry_profile
# in crates/supra-extension/build_utils_impl.rs). Foundry merges [profile.default] as
# the base for every other profile and layers this section's overrides on top.
[profile.production]
# RegistryFacet's views moved to RegistryViewFacet (Entropy-Foundation/smr-moonshot#4101),
# so RegistryFacet is no longer within reach of EIP-170's 24,576-byte limit (enforced by
# load_contracts_bytecode's EIP170_DEPLOYED_CODE_LIMIT check in build_utils_impl.rs) at
# any optimizer_runs value tested.
#
# 800 stays the value regardless: any future fix to RegistryFacet, or to a library it
# inlines, is redeployed as a fresh RegistryFacet that must also fit under the limit
# (Entropy-Foundation/smr-moonshot#2772), so this keeps that facet's deployed-code
# headroom rather than spending it on registry-call gas that #4101 measured at under 0.5%.
#
# CoreFacet is the largest contract in the genesis set above ~10,000 runs, flat from
# 10,000 to 20,000 runs and 994 bytes under the limit at solc's maximum runs value.
optimizer_runs = 800


